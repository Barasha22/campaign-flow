services:
  postgres:
    image: postgres:17
    container_name: campaignflow-postgres
    environment:
      POSTGRES_DB: campaignflow
      POSTGRES_USER: campaignflow_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - campaignflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaignflow_user -d campaignflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campaignflow_postgres_data: