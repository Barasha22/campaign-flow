spring.application.name=campaignflow

spring.datasource.url=jdbc:postgresql://localhost:5432/campaignflow
spring.datasource.username=campaignflow_user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

campaignflow.storage.type=local
campaignflow.storage.local.directory=./data/imports

campaignflow.storage.s3.bucket=${CAMPAIGNFLOW_S3_BUCKET:}
campaignflow.storage.s3.region=${AWS_REGION:ap-northeast-1}
campaignflow.storage.s3.prefix=recipient-imports

campaignflow.outbox.dispatcher.enabled=true
campaignflow.outbox.dispatcher.delay-ms=1000
